<header><div><div class="brand">Logos · mixpathsim · demo</div><h1>Path walker</h1></div><nav aria-label="Demo mode"><a href="path-selection-demo.html">Path selection</a><a href="time-based-path-demo.html">Time-based</a><a href="path-walker-demo.html" aria-current="page">Path walker</a></nav></header>
<section class="settings"><div class="fields"><label class="wide-field">Session strategy<select id="strategy" data-setting></select></label><label>Mix pool size<input id="poolSize" type="number" min="4" max="10000" value="100" data-setting></label><label>Initially malicious (%)<input id="malicious" type="number" min="0" max="100" step="any" value="20" data-setting></label><label>Adversary model<select id="adversary" data-setting></select></label><label id="successLabel">Success / attempt (%)<input id="success" type="number" min="0" max="100" step="any" value="75" data-setting></label><label id="minDaysLabel">Min delay (days)<input id="minDays" type="number" min="0" max="3650" step="any" value="1" data-setting></label><label id="maxDaysLabel">Max delay (days)<input id="maxDays" type="number" min="0" max="3650" step="any" value="7" data-setting></label><label>Attempts / hop / run<select id="budget" data-setting><option value="0">0</option><option value="1" selected>1</option><option value="2">2</option><option value="5">5</option><option value="10">10</option><option value="unlimited">Unlimited</option></select></label><label>Messages per period<input id="frequency" type="number" min=".001" max="100000" step="any" value="4" data-setting></label><label>Period<select id="period" data-setting><option value="1">Day</option><option value="24">Hour</option><option value="1440">Minute</option></select></label></div><div class="fields" style="margin-top:14px"><label id="hopsLabel">Path length<select id="hops" data-setting><option value="3">3 hops</option><option value="4">4 hops</option></select></label><label id="fixedLabel">Fixed positions<input id="fixed" type="number" min="0" max="3" step="1" value="2" data-setting></label><label id="kLabel">Pool size K<input id="k" type="number" min="1" max="10000" step="1" value="3" data-setting></label><label id="alphaLabel">Reuse probability α<input id="alpha" type="number" min="0" max="1" step=".05" value=".9" data-setting></label></div><p id="strategy-description" class="help"></p><p id="profile-description" class="help"></p></section>

</main><script>/* Presentation model, ported from src/path_sampler and src/time_based_path_sampler.
 * Time is measured in seconds; this is an illustrative JS model, not the Rust engine.
 */
(function (root) {
  'use strict';
  const HOUR = 3600, DAY = 86400, IDS = Array.from({length:100}, (_,i)=>i+1);
  const SESSION = {
    random: {name:'Random', description:'A fresh uniform path for every sample.'},
    khf: {name:'K-HF · fixed hops', description:'Keep one node at each selected fixed position for the entire session.'},
    kw: {name:'K/W · candidate pools', description:'Keep disjoint candidate pools at selected positions; choose from each pool per sample.'},
    sticky: {name:'α-sticky', description:'Reuse a uniformly chosen prior distinct path with probability α; otherwise introduce a new path.'},
    lite: {name:'LITE · 5-R-R', hops:3, fixed:1, k:5, description:'One persistent pool of five candidates and two random positions.'},
    standard: {name:'STANDARD · 5-5-R', hops:3, fixed:2, k:5, description:'Two persistent pools of five candidates and one random position.'},
    strict: {name:'STRICT · 3-3-3-R', hops:4, fixed:3, k:3, description:'Three persistent pools of three candidates and one random position.'}
  };
  const TIME = {
    fixed: {name:'Fixed paths', kind:'fixed', description:'Five independent complete paths; each rotates after max(U,U), U = 1–48 hours.'},
    topology: {name:'Fixed topology · configurable', kind:'topology', description:'Sample any route through a persistent local layered topology. Choose degree and node rotation below.'},
    fpoft: {name:'FPOFT · configurable', kind:'fpoft', description:'Five distinct active routes over a local topology. Path and node timers are independent.'},
    lite: {name:'FPOFT LITE · 5-5-R', kind:'fpoft', sizes:[5,5], degree:5, life:[null,null], assumedExit:true, description:'Three hops: two permanent mesh layers plus R. Five fixed prefixes are active.'},
    standard: {name:'FPOFT STANDARD · 5-5-R5', kind:'fpoft', sizes:[5,5,5], degree:3, life:[null,null,[HOUR,48*HOUR]], description:'Five active routes, degree 3. Two permanent layers and five independently rotating exit slots.'},
    strict: {name:'FPOFT STRICT · 5-5-5-R5', kind:'fpoft', sizes:[5,5,5,5], degree:3, life:[null,null,null,[HOUR,48*HOUR]], description:'Five active routes, degree 3. Three permanent layers and five independently rotating exit slots.'},
    vanguard1: {name:'Vanguard 1 · 2-4-6', kind:'topology', sizes:[2,4,6], degree:'mesh', life:[[90*DAY,120*DAY],[30*DAY,60*DAY],[HOUR,48*HOUR]], description:'All 48 mesh routes. Node lifetimes: 90–120 days, 30–60 days, and 1–48 hours. Local mixpathsim adaptation of Vanguards.'},
    vanguard2: {name:'Vanguard 2 · 2-4-8', kind:'topology', sizes:[2,4,8], degree:'mesh', life:[[90*DAY,120*DAY],[30*DAY,60*DAY],[HOUR,48*HOUR]], description:'All 64 mesh routes. Node lifetimes: 90–120 days, 30–60 days, and 1–48 hours. Local mixpathsim adaptation of Vanguards.'}
  };
  const ADV = {
    sybil:{name:'Sybil only', description:'Initially malicious nodes only; no additional attempts.', milestones:[]},
    custom:{name:'Custom', description:'Set the success probability and uniform delay range for each new attempt.', milestones:[]},
    basic:{name:'Basic', description:'50% succeed within 15 days; the rest never succeed.', milestones:[[15*DAY,.5]]},
    apt:{name:'APT', description:'75% succeed within 15 days; the rest succeed by day 30.', milestones:[[15*DAY,.75],[30*DAY,1]]},
    fvey:{name:'FVEY', description:'50% succeed within 2 days, 75% by day 7; the rest never succeed.', milestones:[[2*DAY,.5],[7*DAY,.75]]},
    rubberhose1:{name:'Rubberhose 1', description:'50% succeed between days 2 and 14; the rest never succeed.', milestones:[[2*DAY-1,0],[14*DAY,.5]]},
    rubberhose2:{name:'Rubberhose 2', description:'50% succeed between days 7 and 21; the rest never succeed.', milestones:[[7*DAY-1,0],[21*DAY,.5]]}
  };
  function seeded(seed) { return function(){seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t=Math.imul(seed ^ seed>>>15, 1|seed); t=t+Math.imul(t ^ t>>>7, 61|t)^t; return ((t^t>>>14)>>>0)/4294967296;}; }
  function shuffle(xs,rng) {const a=[...xs]; for(let i=a.length-1;i>0;i--){let j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;}
  function pick(xs,rng) {if(!xs.length) throw Error('No eligible nodes'); return xs[Math.floor(rng()*xs.length)];}
  function draw(xs,n,rng) {if(n>xs.length) throw Error('Too few candidates'); return shuffle(xs,rng).slice(0,n);}
  function integer(a,b,rng) {return a+Math.floor(rng()*(b-a+1));}
  function lifetime(bounds,rng) {return bounds ? Math.max(integer(...bounds,rng),integer(...bounds,rng)) : Infinity;}
  function poolIds(config) {
    const n=config.poolSize;
    if(!Number.isInteger(n)||n<4||n>10000)throw Error('Mix pool size must be a whole number from 4 to 10,000.');
    if(!Number.isInteger(config.malicious)||config.malicious<0||config.malicious>n)throw Error('Initially malicious nodes must fit in the mix pool.');
    return Array.from({length:n},(_,i)=>i+1);
  }
  function validateAdversary(config) {
    if(!ADV[config.adversary])throw Error('Unknown adversary');
    if(config.adversary==='custom'){
      const {success,minDays,maxDays}=config;
      if(!Number.isFinite(success)||success<0||success>100||!Number.isFinite(minDays)||!Number.isFinite(maxDays)||minDays<0||maxDays<minDays||maxDays>3650)throw Error('Custom adversary: success must be 0–100%; delays must satisfy 0 ≤ minimum ≤ maximum ≤ 3650 days.');
    }
  }
  function attackDelay(config,rng) {
    if(config.adversary==='custom')return rng()<config.success/100?(config.minDays+(config.maxDays-config.minDays)*rng())*DAY:Infinity;
    const x=rng();let prev=0;
    for(const [deadline,p] of ADV[config.adversary].milestones){if(x<p)return integer(prev+1,deadline,rng);prev=deadline;}
    return Infinity;
  }
  class Session {

    else $('persistent').innerHTML=`<p class="help">${model.strategy==='sticky'&&p.alpha>0?`α = ${p.alpha} · ${model.sampler.distinct.size} distinct paths retained for possible reuse.`:'Every path is fresh. No random position is targeted for additional compromise.'}</p>`;

    $('attacks').innerHTML=attempts.slice(-12).map(a=>`<div class="attack ${a.status==='done'?'done':''}"><strong>Mix ${a.id}</strong> · ${a.status==='done'?'controlled':a.status==='never'?'never succeeds':'attack in progress'}<div class="track"><span style="width:${a.status==='never'?0:Math.min(100,100*(model.now-a.started)/(a.due-a.started))}%"></span></div><small>${a.status==='never'?'Permanent failure':a.status==='done'?`Completed day ${days(a.due)}`:`${days(a.due-model.now)} days until completion`} · hop ${a.layer+1}</small></div>`).join('')+`<p class="help" style="width:100%">Attempts used: ${Array.from({length:p.hops},(_,l)=>!model.persistentAt(l)?`hop ${l+1}: random (no attacks)`:`hop ${l+1}: ${model.budgets.get(l)||0}/${model.budget===Infinity?'∞':model.budget}`).join(' · ')}${attempts.length>12?' · Showing the 12 latest attempts.':''}</p>`;
    $('recent').innerHTML=model.events.slice(0,3).map(e=>`<li>Day ${days(e.at)} · ${e.text}</li>`).join('');
    $('poolSummary').textContent=`Show the ${model.sampler.ids.length.toLocaleString()}-node mix pool`;
    $('pool').classList.toggle('large-pool',model.sampler.ids.length>200);
    $('pool').innerHTML=model.sampler.ids.map(id=>`<div class="mix ${nodeState(id)==='compromised'?'done':nodeState(id)} ${model.path.includes(id)?'selected':''}" title="Mix ${id}: ${model.controlled(id)?'controlled':'honest'}">${id}</div>`).join('');
    $('next').disabled=playing||model.won||invalid;$('play').disabled=playing||model.won||invalid;$('pause').disabled=!playing;$('play').textContent=goal&&!playing&&!model.won?'Resume':'Run to day';drawPath();
  }
  function tick(){if(!playing)return;try{model.step(goal);if(model.now>=goal){stop();goal=null;}render();if(playing)timer=setTimeout(tick,Number($('speed').value));}catch(e){stop();error(e.message);render();}}
  $('next').onclick=()=>{try{model.nextMessage();if(goal&&model.now>=goal)goal=null;render();}catch(e){error(e.message);}};
  $('play').onclick=()=>{try{goal=number('days',.001,3650)*DAY;if(goal<=model.now)throw Error('Target day must be later than the current simulated time.');$('validation').hidden=true;playing=true;tick();}catch(e){error(e.message);}};
  $('pause').onclick=()=>{stop();render();};$('reset').onclick=reset;
  document.querySelectorAll('[data-setting]').forEach(el=>el.onchange=reset);
  $('days').onchange=()=>{stop();goal=null;render();};
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing){stop();render();}});
  reset();new ResizeObserver(drawPath).observe($('path'));
  window.walkerSnapshot=()=>({...model.snapshot(),playing,goal});
})();
</script></body></html>
